<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/logo-m2m.png">
  <title>Évaluation joueur · MOM Hub</title>
  <link rel="stylesheet" href="css/hub.css">
  <!-- EVAL-JOUEUR lot L2 (FAIT FOI Conception-EVAL-JOUEUR-v1, gelé 15/11/2026,
       D12) : page dédiée ouverte depuis la fiche joueur
       (evaluation-joueur.html?joueur=<id>&depuis=fiche), SANS entrée de nav
       (hub-nav.js INTERDIT non touché). Logique : js/evaluation-joueur.js.
       Droits portés par les RPC sql_263. -->
  <style>
    :root {
      --ev-feu-v: #2d7a3e; --ev-feu-o: #b86e0a; --ev-feu-r: #c73e3e;
      --ev-feu-v-txt: #1f5a32; --ev-feu-o-txt: #8a5208; --ev-feu-r-txt: #a52f2f;
      --ev-bord: #cabe9f; --ev-fond: #ffffff; --ev-doux: #efe9d6;
    }
    * { box-sizing: border-box; }
    body.auth-pending { visibility: hidden; }
    .ev-wrap { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem 4rem; color: var(--ink, #0c3d24); }
    .ev-retour { color: var(--vert-prairie, #2d7a3e); font-size: .9rem; font-weight: 600; text-decoration: none; }
    .ev-retour:hover { text-decoration: underline; }
    .ev-head { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; justify-content: space-between;
      border-bottom: 3px solid var(--gold, #d4a93a); padding-bottom: .9rem; margin: .4rem 0 1.25rem; }
    .ev-head h1 { margin: 0; font-family: 'Oswald', sans-serif; font-size: 1.9rem; font-weight: 600; letter-spacing: .02em; }
    .ev-sub { margin: .2rem 0 0; color: var(--ink-mute, #6b7a6f); font-size: .95rem; }
    .ev-load, .ev-note { color: var(--ink-mute, #6b7a6f); font-size: .9rem; }
    .ev-erreur { background: var(--feedback-error-bg, #fdecea); color: var(--feedback-error-fg, #8a1b14);
      border-radius: 8px; padding: .6rem .8rem; font-size: .9rem; margin: .5rem 0; }
    .ev-ok { background: var(--feedback-success-bg, #e7f3ec); color: var(--feedback-success-fg, #1f5a32);
      border-radius: 8px; padding: .6rem .8rem; font-size: .9rem; margin: .5rem 0; }
    .ev-bloc { background: var(--ev-fond); border: 1px solid var(--ev-bord); border-radius: 12px; margin-bottom: 1.1rem; overflow: hidden; }
    .ev-bloc-corps { padding: 1rem 1.1rem; }
    .ev-lien { display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; justify-content: space-between; }
    .ev-lien-titre { font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--clay, #b8451f); }
    .ev-lien-etat { font-size: .9rem; color: var(--ink-soft, #2a4836); margin-top: .15rem; }
    .ev-actions { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
    .ev-btn { font: inherit; font-size: .9rem; font-weight: 600; min-height: 44px; padding: .45rem 1rem; border-radius: 8px;
      border: 1px solid var(--vert-bouteille, #0c3d24); background: #fff; color: var(--vert-bouteille, #0c3d24); cursor: pointer; }
    .ev-btn:hover:not([disabled]) { background: var(--ev-doux); }
    .ev-btn[disabled] { opacity: .5; cursor: not-allowed; }
    .ev-btn-primaire { background: var(--vert-bouteille, #0c3d24); color: var(--paper, #f8f5ec); }
    .ev-btn-primaire:hover:not([disabled]) { background: var(--vert-bouteille-deep, #062817); }
    .ev-btn-discret { border-color: var(--ev-bord); color: var(--ink-soft, #2a4836); }
    .ev-btn-danger { border-color: #c73e3e; color: #a52f2f; }
    .ev-kpis { display: flex; flex-wrap: wrap; gap: 1.6rem; }
    .ev-kpi-v { font-family: 'Oswald', sans-serif; font-size: 1.6rem; font-weight: 600; }
    .ev-kpi-l { font-size: .8rem; color: var(--ink-mute, #6b7a6f); }
    .ev-legende { font-size: .85rem; color: var(--ink-soft, #2a4836); max-width: 460px; }
    .ev-periode-tete { display: flex; flex-wrap: wrap; gap: .7rem; align-items: center; justify-content: space-between;
      padding: .8rem 1.1rem; background: var(--ev-doux); border-bottom: 1px solid var(--ev-bord); }
    .ev-periode-tete h2 { margin: 0; font-family: 'Oswald', sans-serif; font-size: 1.15rem; font-weight: 600; letter-spacing: .02em; }
    .ev-num { font-family: 'Oswald', sans-serif; background: var(--vert-bouteille, #0c3d24); color: var(--gold, #d4a93a);
      border-radius: 6px; padding: .15rem .5rem; margin-right: .5rem; }
    .ev-badge { display: inline-block; border-radius: 999px; padding: .15rem .65rem; font-size: .75rem; font-weight: 700; }
    .ev-badge-brouillon { background: #fff; color: var(--ink-soft, #2a4836); border: 1px solid var(--ev-bord); }
    .ev-badge-publie { background: var(--feedback-success-bg, #e7f3ec); color: var(--feedback-success-fg, #1f5a32); }
    .ev-badge-vide { background: transparent; color: var(--ink-mute, #6b7a6f); border: 1px dashed var(--ev-bord); }
    .ev-objectifs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: .8rem; margin-bottom: 1rem; }
    .ev-champ { display: flex; flex-direction: column; gap: .3rem; font-size: .85rem; font-weight: 700; }
    .ev-champ input, .ev-champ textarea, .ev-obs { font: inherit; font-size: .92rem; font-weight: 400; color: var(--ink, #0c3d24);
      padding: .55rem .7rem; border: 1px solid var(--ev-bord); border-radius: 8px; background: #fff; }
    .ev-obs { width: 100%; resize: vertical; min-height: 2.6rem; }
    .ev-critere { display: grid; grid-template-columns: minmax(170px, 230px) auto minmax(0, 1fr); gap: .8rem; align-items: center;
      padding: .7rem 0; border-top: 1px solid var(--ev-doux); }
    .ev-critere-nom { font-weight: 700; font-size: .95rem; }
    .ev-feux { display: flex; gap: .35rem; }
    .ev-feu { font: inherit; font-weight: 700; font-size: .85rem; min-width: 46px; min-height: 44px; border-radius: 8px; cursor: pointer; background: #fff; border: 2px solid; }
    .ev-feu[disabled] { cursor: default; }
    .ev-feu-V { border-color: var(--ev-feu-v); color: var(--ev-feu-v-txt); }
    .ev-feu-O { border-color: var(--ev-feu-o); color: var(--ev-feu-o-txt); }
    .ev-feu-R { border-color: var(--ev-feu-r); color: var(--ev-feu-r-txt); }
    .ev-feu-V[aria-pressed="true"] { background: var(--ev-feu-v); color: #fff; }
    .ev-feu-O[aria-pressed="true"] { background: var(--ev-feu-o); color: #fff; }
    .ev-feu-R[aria-pressed="true"] { background: var(--ev-feu-r); color: #fff; }
    .ev-pied { display: flex; flex-wrap: wrap; gap: .7rem; align-items: center; justify-content: space-between;
      padding: .8rem 1.1rem; background: var(--ev-doux); border-top: 1px solid var(--ev-bord); }
    .ev-pied-info { font-size: .85rem; color: var(--ink-soft, #2a4836); }
    .ev-reponse { margin-top: .9rem; background: var(--feedback-info-bg, #eaf1fa); border-radius: 10px; padding: .7rem .9rem; }
    .ev-reponse-titre { font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--bleu-base, #3066BE); }
    .ev-reponse p { margin: .25rem 0 0; font-size: .92rem; }
    .ev-pastille { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%;
      color: #fff; font-size: .78rem; font-weight: 700; }
    .ev-pastille-V { background: var(--ev-feu-v); } .ev-pastille-O { background: var(--ev-feu-o); } .ev-pastille-R { background: var(--ev-feu-r); }
    .ev-pastille-vide { background: #fff; color: var(--ink-mute, #6b7a6f); border: 1px dashed var(--ev-bord); }
    .ev-matchs { list-style: none; margin: 0; padding: 0; }
    .ev-matchs li { display: flex; flex-wrap: wrap; gap: .7rem; align-items: center; padding: .6rem 0; border-top: 1px solid var(--ev-doux); }
    .ev-matchs li:first-child { border-top: 0; }
    .ev-match-texte { flex: 1 1 260px; min-width: 0; font-size: .92rem; }
    .ev-match-meta { color: var(--ink-mute, #6b7a6f); font-size: .82rem; }
    .ev-niveau { font-size: .72rem; font-weight: 700; border-radius: 999px; padding: .1rem .55rem; background: var(--ev-doux); }
    .ev-titre-section { font-family: 'Oswald', sans-serif; font-size: 1.15rem; font-weight: 600; margin: 0 0 .7rem; }
    @media (max-width: 720px) {
      .ev-critere { grid-template-columns: 1fr; gap: .45rem; }
    }
    @media print {
      .topbar, .hub-nav, footer, .ev-actions, .ev-retour, .ev-btn, #ev-bloc-lien { display: none !important; }
      .ev-bloc { break-inside: avoid; }
    }
  </style>
</head>
<body class="auth-pending">

  <header class="topbar">
    <div class="brand">
      <div class="brand-logo"><img src="assets/logo-m2m.png" alt="MOM Rugby"></div>
      <div class="brand-text">
        <h1>MOM Hub</h1>
        <p>Mutzig Ovalie Molsheim</p>
      </div>
    </div>

    <div class="season-pill" id="season-pill">SAISON …</div>

    <!-- Navigation thématique « Mon équipe » injectée par js/hub-nav.js
         (aucune entrée propre à cette page : D12). -->
    <nav class="main-nav hub-nav" data-hub-nav="equipe"></nav>

    <div class="user-profile">
      <div class="avatar">MOM</div>
      <div class="user-info">
        <div class="user-name">Éducateur MOM</div>
        <div class="user-role">Espace éducateurs</div>
      </div>
      <a href="./" class="user-action" title="Retour au portail" aria-label="Retour au portail">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12 12 3l9 9"/><path d="M5 10v10h14V10"/></svg>
      </a>
      <button type="button" class="user-action" id="btn-signout" title="Se déconnecter" aria-label="Se déconnecter">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </header>

  <script src="js/hub-nav.js"></script>

  <div class="ev-wrap">
    <main id="ev-page"><p class="ev-load">Initialisation…</p></main>
  </div>
  <footer>MOM Hub · Évaluation joueur — Mutzig Ovalie Molsheim</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/season-pill.js"></script>
  <script src="js/evaluation-joueur.js"></script>
  <script>
    /* Boot topbar (patron parcours-performance.html) : anonyme → login.html ;
       droits de lecture/écriture portés par les RPC sql_263. */
    (async function () {
      'use strict';
      if (window.SupabaseHub && SupabaseHub.getSession) {
        var _session = await SupabaseHub.getSession();
        if (!_session) { window.location.replace('login.html'); return; }
      }
      try {
        if (window.SupabaseHub && SupabaseHub.getMyRoles) {
          var roles = await SupabaseHub.getMyRoles();
          document.body.classList.add('auth-resolved');
          if (Array.isArray(roles) && roles.indexOf('admin') !== -1) {
            document.body.classList.add('auth-admin');
          }
        } else {
          document.body.classList.add('auth-resolved');
        }
      } catch (_) { document.body.classList.add('auth-resolved'); }
      document.body.classList.remove('auth-pending');

      var _so = document.getElementById('btn-signout');
      if (_so && window.SupabaseHub && SupabaseHub.signOut) {
        _so.addEventListener('click', async function () {
          _so.disabled = true;
          await SupabaseHub.signOut();
        });
      }
      if (window.EvaluationJoueur) {
        EvaluationJoueur.demarrer();
      } else {
        document.getElementById('ev-page').innerHTML =
          '<section class="ev-bloc"><div class="ev-bloc-corps"><p class="ev-erreur">Module Évaluation indisponible.</p></div></section>';
      }
    })();
  </script>
</body>
</html>
