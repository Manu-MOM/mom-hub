<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/logo-m2m.png">
  <title>Planification annuelle · MOM Hub</title>
  <link rel="stylesheet" href="css/hub.css">
  <style>
    :root {
      --vert: #2d7a3e; --vert-fonce: #0c3d24; --vert-light: rgba(45,122,62,.1);
      --gris: #6b7a6f; --bord: #cabe9f; --attente: #8a93a0;
      --paper: #f8f5ec; --paper-warm: #efe9d6; --carte: #ffffff;
      --gold: #d4a93a; --clay: #b8451f; --ink: #0c3d24;
    }
    * { box-sizing: border-box; }
    /* body géré par hub.css (fond papier + texture + topbar). */
    body { color: var(--ink); }
    /* KIT-UX-RESPONSIVE-URGENT (suite, doctrine pt194 EMPTY-STATES-REFUS) :
       masque tout le body tant que la session n'est pas vérifiée, pour éviter
       un flash de contenu avant la redirection anonyme vers login.html.
       Pattern déjà utilisé sur ~24 autres pages (bibliotheque.html, etc.). */
    body.auth-pending { visibility: hidden; }
    .pa-wrap { max-width: 980px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

    .pa-load { color: var(--gris); }
    .pa-attente { color: var(--attente); font-style: italic; margin: .4rem 0 0; }

    .pa-head { border-bottom: 3px solid var(--vert); padding-bottom: .75rem; margin-bottom: 1.25rem; }
    .pa-head h1 { margin: 0; font-size: 1.9rem; color: var(--vert-fonce); }
    .pa-sub { margin: .25rem 0 0; color: var(--gris); font-size: .95rem; }
    .pa-readonly { margin: .5rem 0 0; color: var(--clay); font-size: .9rem; font-weight: 600; }

    .pa-card {
      background: var(--carte); border: 1px solid var(--bord); border-radius: 12px;
      padding: 1rem 1.1rem; margin-bottom: 1.25rem;
    }
    .pa-card h2 { margin: 0 0 .9rem; font-size: 1.15rem; color: var(--vert-fonce); }

    /* ---- Bloc éditable ---- */
    .pa-bloc {
      border: 1px solid var(--bord); border-radius: 10px; padding: .9rem 1rem;
      margin-bottom: 1rem; background: var(--paper);
    }
    .pa-bloc__bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: .7rem; }
    .pa-bloc__rang { font-weight: 700; color: var(--vert-fonce); letter-spacing: .02em; }
    .pa-bloc__actions { display: flex; gap: .35rem; }
    .pa-mini {
      border: 1px solid var(--bord); background: var(--carte); color: var(--vert-fonce);
      border-radius: 6px; padding: .25rem .5rem; font-size: .82rem; cursor: pointer;
    }
    .pa-mini:hover { background: var(--paper-warm); }
    .pa-mini--del { color: var(--clay); border-color: #e3b3a4; }

    .pa-row { display: flex; gap: .7rem; flex-wrap: wrap; margin-bottom: .6rem; }
    .pa-field { display: flex; flex-direction: column; gap: .25rem; font-size: .85rem; color: var(--gris); }
    .pa-field--grow { flex: 1 1 220px; }
    .pa-field--full { width: 100%; }
    .pa-field span { font-weight: 600; }
    .pa-field input, .pa-field textarea, .pa-select, .pa-axe__custom {
      font: inherit; padding: .4rem .55rem; border: 1px solid var(--bord);
      border-radius: 6px; background: #fff; color: var(--ink);
    }
    .pa-field textarea { resize: vertical; }

    .pa-axe { margin: .6rem 0; }
    .pa-axe__lbl { font-size: .85rem; font-weight: 700; color: var(--vert); text-transform: uppercase; letter-spacing: .02em; margin-bottom: .35rem; }
    .pa-axe__lbl em { font-weight: 400; font-style: italic; text-transform: none; color: var(--gris); }
    .pa-select { width: 100%; }
    .pa-axe__custom { width: 100%; margin-top: .4rem; }

    .pa-indiv { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .35rem .8rem; }
    .pa-check { display: inline-flex; align-items: center; gap: .4rem; font-size: .9rem; color: var(--ink); cursor: pointer; }
    .pa-check--inline { margin: .5rem 0; }

    .pa-btn {
      border: none; background: var(--vert); color: #fff; border-radius: 8px;
      padding: .5rem .9rem; font-size: .92rem; font-weight: 600; cursor: pointer;
    }
    .pa-btn:hover { background: var(--vert-fonce); }
    .pa-btn--add { margin-top: .4rem; background: var(--carte); color: var(--vert-fonce); border: 1px dashed var(--vert); }
    .pa-btn--add:hover { background: var(--vert-light); }
    .pa-bloc__save { display: flex; align-items: center; gap: .6rem; margin-top: .6rem; }
    .pa-bloc__state { font-size: .85rem; color: var(--gris); }
    .pa-bloc__state--ok { color: var(--vert); }
    .pa-bloc__state--err { color: var(--clay); }

    /* ---- PLANIF-SOUSBLOCS-PAR-JOUR : jours d'entraînement (édition) ---- */
    /* Section additive sous le bloc. Réutilise les variables MOM existantes,
       aucune couleur hors charte. hub.css INTERDIT non touché. */
    .pa-jours { margin-top: .9rem; padding-top: .7rem; border-top: 1px solid var(--bord); }
    .pa-jours__lbl { font-size: .85rem; font-weight: 700; color: var(--vert); text-transform: uppercase; letter-spacing: .02em; margin-bottom: .5rem; }
    .pa-jours__lbl em { font-weight: 400; font-style: italic; text-transform: none; color: var(--gris); }
    .pa-jours__hint { font-size: .82rem; color: var(--gris); margin: .2rem 0 .5rem; }
    .pa-jours__add { font-size: .86rem; }
    /* Un jour : le trait de séparation (option B validée) délimite chaque jour. */
    .pa-jour { border-top: 1px solid var(--bord); padding-top: .7rem; margin-top: .7rem; }
    .pa-jour:first-of-type { border-top: none; padding-top: .2rem; margin-top: .2rem; }
    .pa-jour__bar { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-bottom: .4rem; }
    .pa-jour__select { font: inherit; padding: .35rem .5rem; border: 1px solid var(--bord); border-radius: 6px; background: #fff; color: var(--ink); }
    .pa-jour__titre { flex: 1 1 200px; font: inherit; padding: .4rem .55rem; border: 1px solid var(--bord); border-radius: 6px; background: #fff; color: var(--ink); }
    .pa-jour__actions { display: flex; gap: .35rem; margin-left: auto; }

    /* ---- Frise emboîtée (lecture) ---- */
    .pa-frise { display: flex; flex-wrap: wrap; gap: 0; }
    .pa-frise__bloc {
      position: relative; flex: 1 1 200px; min-width: 180px;
      background: var(--vert); color: #fff; padding: .9rem 1.4rem .9rem 1.6rem;
      margin-right: -14px; /* chevauchement pour l'emboîtement */
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%, 14px 50%);
      box-shadow: 0 2px 6px var(--vert-light);
    }
    .pa-frise__bloc:first-child {
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%);
      padding-left: 1.2rem;
    }
    .pa-frise__bloc:nth-child(odd) { background: var(--vert-fonce); }
    .pa-frise__bloc--inter { background: var(--gold); color: var(--ink); }
    .pa-frise__num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.25);
      font-size: .8rem; font-weight: 700; margin-bottom: .35rem;
    }
    .pa-frise__bloc--inter .pa-frise__num { background: rgba(12,61,36,.18); }
    .pa-frise__titre { font-weight: 700; font-size: .98rem; margin-bottom: .25rem; }
    .pa-frise__date { font-size: .76rem; opacity: .85; margin-bottom: .3rem; }
    .pa-frise__axes { margin: .2rem 0 0; padding-left: 1rem; font-size: .78rem; opacity: .92; }
    .pa-frise__axes li { margin: .1rem 0; }
    .pa-frise__comm { font-size: .76rem; opacity: .8; margin-top: .35rem; font-style: italic; }

    /* ---- Écran de choix transverse ---- */
    .pa-choix { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.25rem; }
    .pa-choix__col h3 { margin: 0 0 .6rem; font-size: 1rem; color: var(--vert-fonce); }
    .pa-choix__item {
      display: block; width: 100%; text-align: left; margin-bottom: .4rem;
      border: 1px solid var(--bord); background: var(--paper); color: var(--ink);
      border-radius: 8px; padding: .6rem .8rem; font-size: .95rem; font-weight: 600; cursor: pointer;
    }
    .pa-choix__item:hover { background: var(--vert-light); border-color: var(--vert); }

    footer { max-width: 980px; margin: 2rem auto 0; color: var(--attente); font-size: .8rem; text-align: center; }

    @media (max-width: 640px) {
      .pa-frise__bloc { flex: 1 1 100%; margin-right: 0; margin-bottom: 6px;
        clip-path: none; border-radius: 8px; }
      .pa-frise__bloc:first-child { clip-path: none; }
    }

    /* =================================================================
       PLANIF-FRISE-COSMETIQUE-EXPORT
       Cartouche + frise horizontale (chevrons alternés, scrollable,
       cliquables) + frise verticale (détail) + export PDF paysage.
       Additif : n'altère aucun style existant.
       ================================================================= */
    :root {
      --clay: #b8451f; --clayd: #8a3113;
      --goldd: #a67c1a; --gold-fonce: #a67c1a;
    }

    /* ---- Cartouche (en-tête type club) ---- */
    .pa-cartouche {
      display: flex; align-items: center; gap: 1rem;
      background: linear-gradient(135deg, var(--vert-fonce), var(--vert));
      color: #fff; border-radius: 12px; padding: 1rem 1.3rem;
      margin-bottom: 1.25rem; position: relative; overflow: hidden;
    }
    .pa-cartouche::after {
      content: ""; position: absolute; right: -40px; top: -40px;
      width: 180px; height: 180px; border-radius: 50%;
      background: rgba(255, 255, 255, .05);
    }
    .pa-cartouche__ecusson {
      width: 64px; height: 64px; flex: 0 0 auto; z-index: 1;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .3));
    }
    .pa-cartouche__txt { z-index: 1; }
    .pa-cartouche__club {
      font-size: .76rem; text-transform: uppercase; letter-spacing: .14em;
      opacity: .85; margin: 0;
    }
    .pa-cartouche__titre { font-size: 1.5rem; font-weight: 800; margin: .1rem 0 0; line-height: 1.1; }
    .pa-cartouche__sous { font-size: .82rem; opacity: .9; margin: .15rem 0 0; }
    .pa-cartouche__saison { margin-left: auto; z-index: 1; text-align: right; }
    .pa-cartouche__pill {
      display: inline-block; background: var(--gold); color: var(--vert-fonce);
      font-weight: 800; font-size: .82rem; padding: .3rem .8rem;
      border-radius: 20px; letter-spacing: .02em; white-space: nowrap;
    }

    /* ---- Barre d'outils (export) ---- */
    .pa-frise-tools { display: flex; justify-content: flex-end; margin-bottom: 1rem; }
    .pa-frise-export {
      background: var(--vert); color: #fff; border: none; border-radius: 8px;
      padding: .5rem .9rem; font-size: .9rem; font-weight: 600; cursor: pointer;
    }
    .pa-frise-export:hover { background: var(--vert-fonce); }

    /* ---- Frise HORIZONTALE : chevrons alternés, scrollable ---- */
    .pa-fh-scroll { overflow-x: auto; overflow-y: hidden; padding-bottom: .5rem; }
    .pa-fh-scroll::-webkit-scrollbar { height: 8px; }
    .pa-fh-scroll::-webkit-scrollbar-thumb { background: var(--bord); border-radius: 4px; }
    .pa-fh { display: flex; gap: 0; min-width: min-content; }
    .pa-fh__bloc {
      position: relative; flex: 1 1 190px; color: #fff;
      padding: .8rem 1.6rem; margin-right: -16px;
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%, 16px 50%);
      cursor: pointer; transition: transform .12s, filter .12s;
      box-shadow: 0 2px 5px rgba(12, 61, 36, .18);
    }
    .pa-fh__bloc:hover { filter: brightness(1.08); transform: translateY(-2px); }
    .pa-fh__bloc:first-child {
      padding-left: 1.1rem;
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%);
    }
    .pa-fh__bloc:last-child {
      padding-right: 1.1rem; margin-right: 0;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 16px 50%);
    }
    .pa-fh__bloc.c-vertf { background: var(--vert-fonce); }
    .pa-fh__bloc.c-gold  { background: var(--gold); color: var(--vert-fonce); }
    .pa-fh__bloc.c-vert  { background: var(--vert); }
    .pa-fh__bloc.c-clay  { background: var(--clay); }
    .pa-fh__bloc--inter {
      background: repeating-linear-gradient(45deg, var(--gold), var(--gold) 10px, var(--goldd) 10px, var(--goldd) 20px);
      color: var(--vert-fonce);
    }
    .pa-fh__head { display: flex; align-items: center; gap: .45rem; margin-bottom: .3rem; }
    .pa-fh__num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 50%;
      background: rgba(255, 255, 255, .28); font-size: .74rem; font-weight: 800;
      flex: 0 0 auto;
    }
    .pa-fh__bloc.c-gold .pa-fh__num, .pa-fh__bloc--inter .pa-fh__num { background: rgba(12, 61, 36, .22); }
    .pa-fh__titre { font-weight: 800; font-size: .98rem; }
    .pa-fh__date { font-size: .74rem; opacity: .9; padding-left: calc(22px + .45rem); }

    /* ---- Frise VERTICALE (détail) ---- */
    .pa-fv-titre {
      font-size: .92rem; text-transform: uppercase; letter-spacing: .03em;
      color: var(--vert-fonce); font-weight: 700; margin: 1.5rem 0 1.1rem;
    }
    .pa-fv { position: relative; padding-left: 2.3rem; }
    .pa-fv__rail { position: absolute; left: 10px; top: 6px; bottom: 6px; width: 2px; background: var(--bord); }
    .pa-fv__item { position: relative; margin-bottom: 1rem; scroll-margin-top: 1rem; }
    .pa-fv__item:last-child { margin-bottom: 0; }
    .pa-fv__num {
      position: absolute; left: -2.3rem; top: 1px; width: 22px; height: 22px;
      border-radius: 50%; color: #fff; display: flex; align-items: center;
      justify-content: center; font-size: .74rem; font-weight: 800; background: var(--vert);
    }
    .pa-fv__num.c-vertf { background: var(--vert-fonce); }
    .pa-fv__num.c-gold  { background: var(--goldd); }
    .pa-fv__num.c-vert  { background: var(--vert); }
    .pa-fv__num.c-clay  { background: var(--clay); }
    .pa-fv__card {
      background: var(--carte); border: 1px solid var(--bord);
      border-left: 3px solid var(--vert); border-radius: 8px; padding: .7rem .9rem;
    }
    .pa-fv__card.c-vertf { border-left-color: var(--vert-fonce); }
    .pa-fv__card.c-gold  { border-left-color: var(--goldd); }
    .pa-fv__card.c-vert  { border-left-color: var(--vert); }
    .pa-fv__card.c-clay  { border-left-color: var(--clay); }
    .pa-fv__item--inter .pa-fv__num { background: var(--goldd); }
    .pa-fv__item--inter .pa-fv__card { background: #fdf7e6; border: 1px solid var(--gold); border-left: 3px solid var(--goldd); }
    .pa-fv__bar { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; flex-wrap: wrap; margin-bottom: .4rem; }
    .pa-fv__titre { font-weight: 700; color: var(--vert-fonce); font-size: .95rem; }
    .pa-fv__titre em { font-weight: 400; font-style: italic; font-size: .72rem; color: var(--gris); }
    .pa-fv__date { font-size: .72rem; color: var(--gris); }
    .pa-fv__card ul { margin: 0; padding-left: 1.1rem; font-size: .78rem; color: var(--ink); line-height: 1.55; }
    .pa-fv__card p { margin: 0; font-size: .78rem; color: var(--ink); font-style: italic; }
    /* PLANIF-SOUSBLOCS-PAR-JOUR : jours dans la frise (lecture). Additif. */
    .pa-fv-jours { margin-top: .4rem; }
    .pa-fv-jour { margin-top: .35rem; padding-top: .35rem; border-top: 1px dashed var(--bord); }
    .pa-fv-jour:first-child { border-top: none; padding-top: 0; margin-top: .2rem; }
    .pa-fv-jour__tete { display: block; font-size: .74rem; font-weight: 700; color: var(--vert-fonce); text-transform: uppercase; letter-spacing: .02em; }
    .pa-fv-jour ul { margin: .15rem 0 0; padding-left: 1.1rem; font-size: .76rem; color: var(--ink); line-height: 1.5; }
    @keyframes pa-flash { 0% { background: #fff6d8; } 100% { background: var(--carte); } }
    .pa-fv__card.is-target { animation: pa-flash 1.6s ease-out; }

    @media (max-width: 640px) {
      .pa-fh__bloc { flex: 1 1 160px; }
    }

    /* ---- IMPRESSION : 1 page A4 paysage, condensé, cartouche visible ---- */
    @media print {
      @page { size: A4 landscape; margin: 8mm; }
      html, body {
        background: #fff !important; padding: 0; margin: 0;
        -webkit-print-color-adjust: exact; print-color-adjust: exact;
      }
      .topbar, .hub-nav, footer, .pa-frise-tools,
      .pa-head, .pa-bloc, .pa-btn--add,
      section.pa-card:not(.pa-frise-card) { display: none !important; }
      .pa-frise-card { border: none !important; box-shadow: none; padding: 0; margin: 0; background: #fff; }
      .pa-cartouche { margin-bottom: .5rem; padding: .5rem .9rem; border-radius: 8px; }
      .pa-cartouche__ecusson { width: 46px; height: 46px; }
      .pa-cartouche__titre { font-size: 1.15rem; }
      .pa-cartouche__sous { font-size: .7rem; }
      /* frise horizontale : wrap + tout visible, compacte */
      .pa-fh-scroll { overflow: visible; }
      .pa-fh { flex-wrap: wrap; min-width: 0; }
      .pa-fh__bloc { flex: 1 1 150px; padding: .45rem 1.1rem; box-shadow: none; break-inside: avoid; }
      .pa-fh__titre { font-size: .82rem; }
      .pa-fh__date { font-size: .64rem; }
      /* détail : 3 colonnes pour tenir en hauteur sur une page */
      .pa-fv-titre { margin: .5rem 0 .4rem; }
      .pa-fv { padding-left: 0; }
      .pa-fv__rail { display: none; }
      .pa-fv-grid { column-count: 3; column-gap: 8mm; }
      .pa-fv__item { margin: 0 0 4mm; break-inside: avoid; padding-left: 0; }
      .pa-fv__num { position: static; display: inline-flex; margin-right: .3rem; vertical-align: middle; width: 18px; height: 18px; font-size: .68rem; }
      .pa-fv__card { padding: .4rem .6rem; }
      .pa-fv__card ul { font-size: .68rem; line-height: 1.4; }
      .pa-fv__titre { font-size: .82rem; }
    }
  </style>
</head>
<body class="auth-pending">

  <header class="topbar">
    <div class="brand">
      <div class="brand-logo"><img src="assets/logo-m2m.png" alt="MOM Rugby"></div>
      <div class="brand-text">
        <h1>MOM Hub</h1>
        <p>Mutzig Ovalie Molsheim</p>
      </div>
    </div>

    <div class="season-pill" id="season-pill">SAISON …</div>

    <nav class="main-nav hub-nav" data-hub-nav="pedagogie"></nav>

    <div class="icon-row">
      <button class="icon-btn" title="Recherche" aria-label="Recherche">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
    </div>

    <div class="user-profile">
      <div class="avatar">MOM</div>
      <div class="user-info">
        <div class="user-name">Éducateur MOM</div>
        <div class="user-role">Espace éducateurs</div>
      </div>
      <a href="./" class="user-action" title="Retour au portail" aria-label="Retour au portail">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12 12 3l9 9"/><path d="M5 10v10h14V10"/></svg>
      </a>
      <button type="button" class="user-action" id="btn-signout" title="Se déconnecter" aria-label="Se déconnecter">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </header>

  <!-- Navigation thématique Pédagogie : contenu servi par js/hub-nav.js (thème « pedagogie »). -->
  <script src="js/hub-nav.js"></script>

  <div class="pa-wrap">
    <main id="pa-mount"><p class="pa-load">Initialisation…</p></main>
  </div>
  <footer>MOM Hub · planification annuelle — Mutzig Ovalie Molsheim</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
<script src="js/season-pill.js"></script>
  <script>
    /* Boot topbar — SANS garde admin (page accessible aux référents). */
    (async function () {
      'use strict';
      // KIT-UX-RESPONSIVE-URGENT (suite) : anonyme → redirection login.html
      // au lieu du message "Accès réservé" affiché sur place (doctrine pt194
      // EMPTY-STATES-REFUS inchangée pour un connecté sans droit de catégorie,
      // qui garde le message inline plus bas — seule l'absence de session
      // change de traitement).
      if (window.SupabaseHub && SupabaseHub.getSession) {
        var _session = await SupabaseHub.getSession();
        if (!_session) { window.location.replace('login.html'); return; }
      }
      try {
        if (window.SupabaseHub && SupabaseHub.getMyRoles) {
          var roles = await SupabaseHub.getMyRoles();
          document.body.classList.add('auth-resolved');
          if (Array.isArray(roles) && roles.indexOf('admin') !== -1) {
            document.body.classList.add('auth-admin');
          }
        } else {
          document.body.classList.add('auth-resolved');
        }
      } catch (_) { document.body.classList.add('auth-resolved'); }
      document.body.classList.remove('auth-pending');

      var _so = document.getElementById('btn-signout');
      if (_so && window.SupabaseHub && SupabaseHub.signOut) {
        _so.addEventListener('click', async function () {
          _so.disabled = true;
          await SupabaseHub.signOut();
        });
      }
      try {
        var _s = await SupabaseHub.getSaisonActive();
        if (_s && _s.libelle) {
          var _p = document.getElementById('season-pill');
          if (_p) _p.textContent = String(_s.libelle).toUpperCase();
        }
      } catch (_) { /* libellé statique conservé */ }
    })();
  </script>
  <script src="js/planification-editor.js"></script>
  <script>
    (function () {
      'use strict';
      var mount = document.getElementById('pa-mount');
      if (!window.PlanificationEditor || !window.SupabaseHub) {
        mount.innerHTML = '<section class="pa-card"><h2>Erreur</h2>' +
          '<p>Module de planification indisponible.</p></section>';
        return;
      }
      window.PlanificationEditor.start(mount);
    })();
  </script>
